<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>METANOIA — Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--fg:#f3f0ea;--line:#262626}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:DM Sans,sans-serif}
.nav{position:fixed;top:0;left:0;right:0;padding:22px 4vw;display:flex;justify-content:space-between;mix-blend-mode:difference;color:#fff;z-index:5}
a{color:inherit;text-decoration:none}
.hero{min-height:55vh;display:grid;place-items:center;text-align:center;padding:8rem 2rem 4rem}
h1{font-size:clamp(70px,14vw,180px);font-weight:300;letter-spacing:-.05em;margin:0}
p{color:#bdb8b0;font-size:20px}
.gallery{columns:3 320px;column-gap:20px;padding:0 4vw 5rem}
.item{break-inside:avoid;margin:0 0 20px;overflow:hidden;cursor:pointer;opacity:0;transform:translateY(35px);transition:opacity .7s,transform .7s}
.item.show{opacity:1;transform:none}
.item img{width:100%;display:block;transition:transform .8s ease,filter .5s ease}
.item:hover img{transform:scale(1.025);filter:brightness(.88)}
.lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:99}
.lb.open{display:flex}
.lb img{max-width:92vw;max-height:92vh;box-shadow:0 30px 80px #000}
.btn{position:absolute;background:none;border:0;color:#fff;font-size:48px;cursor:pointer}
.c{top:20px;right:25px}.l{left:25px}.r{right:25px}
@media(max-width:700px){.gallery{columns:1}}
</style></head>
<body>
<nav class="nav"><a href="index.html">METANOIA</a><a href="index.html">Home</a></nav>
<section class="hero"><div><h1>Gallery</h1><p>Twenty-two fragments of memory.</p></div></section>
<div class="gallery" id="g"></div>
<div class="lb" id="lb"><button class="btn c">×</button><button class="btn l">‹</button><img id="im"><button class="btn r">›</button></div>
<script>
const photos=[
{src:"gallery/image1.jpg"},
{src:"gallery/image10.jpg"},
{src:"gallery/image13.jpg"},
{src:"gallery/image15.jpg"},
{src:"gallery/image3.jpg"},
{src:"gallery/image4.jpg"},
{src:"gallery/image2.jpeg"},
{src:"gallery/image11.jpg"},
{src:"gallery/image12.jpg"},
{src:"gallery/image5.jpg"},
{src:"gallery/image6.jpg"},
{src:"gallery/image7.jpg"},
{src:"gallery/image8.jpg"},
{src:"gallery/image9.jpeg"},
{src:"gallery/image14.jpg"},
{src:"gallery/image16.jpeg"},
{src:"gallery/image17.jpg"},
{src:"gallery/image18.jpg"},
{src:"gallery/image19.jpg"},
{src:"gallery/image20.jpg"},
{src:"gallery/image21.jpg"},
{src:"gallery/image22.jpg"}
];
const g=document.getElementById('g');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('show')}),{threshold:.08});
photos.forEach((p,i)=>{let d=document.createElement('figure');d.className='item';d.innerHTML=`<img loading="lazy" decoding="async" src="${p.src}" alt="">`;d.onclick=()=>o(i);g.appendChild(d);io.observe(d);});
const lb=document.getElementById('lb'),im=document.getElementById('im');let i=0;
function o(n){i=n;im.src=photos[i].src;new Image().src=photos[(i+1)%photos.length].src;new Image().src=photos[(i-1+photos.length)%photos.length].src;lb.classList.add('open');document.body.style.overflow='hidden';}
function m(v){o((i+v+photos.length)%photos.length)}
document.querySelector('.c').onclick=()=>{lb.classList.remove('open');document.body.style.overflow='';};
document.querySelector('.l').onclick=()=>m(-1);document.querySelector('.r').onclick=()=>m(1);
lb.onclick=e=>{if(e.target===lb)document.querySelector('.c').click();};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')document.querySelector('.c').click();if(e.key==='ArrowRight')m(1);if(e.key==='ArrowLeft')m(-1);});
let sx=0;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX);lb.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(dx>50)m(-1);if(dx<-50)m(1);});
</script>
</body></html>
