<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Metanoia</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0b0b0b;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        nav{
            position:sticky;
            top:0;
            background:rgba(10,10,10,.95);
            padding:25px 8%;
            display:flex;
            justify-content:space-between;
            align-items:center;
            backdrop-filter:blur(15px);
        }

        nav a{
            color:white;
            text-decoration:none;
            margin-left:25px;
            font-weight:600;
        }

        h1{
            text-align:center;
            margin:60px 0 10px;
            font-size:48px;
        }

        .subtitle{
            text-align:center;
            color:#999;
            margin-bottom:60px;
        }

        .gallery{
            width:90%;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:20px;
            padding-bottom:80px;
        }

        .gallery img{
            width:100%;
            border-radius:18px;
            display:block;
            transition:.35s;
            cursor:pointer;
        }

        .gallery img:hover{
            transform:scale(1.03);
        }

        footer{
            text-align:center;
            padding:50px;
            color:#888;
        }
    </style>

</head>
