<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>METANOIA — Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--fg:#f2efe9;--muted:#9b978f;--line:#252525}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:300 15px "DM Sans",sans-serif}
a{text-decoration:none;color:inherit}
nav{position:sticky;top:0;background:rgba(8,8,8,.9);backdrop-filter:blur(10px);display:flex;justify-content:space-between;padding:22px 5vw;border-bottom:1px solid var(--line);z-index:10}
.brand{letter-spacing:.3em;font-size:14px}
.links{display:flex;gap:28px;font-size:11px;text-transform:uppercase;letter-spacing:.18em}
header{text-align:center;padding:90px 5vw 60px}
h1{font:300 clamp(52px,10vw,110px) "DM Sans";margin:0;letter-spacing:-.05em}
p{color:var(--muted);max-width:700px;margin:18px auto 0;line-height:1.6}
.filters{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:40px 0}
button{background:none;border:1px solid #333;color:#ddd;padding:10px 18px;border-radius:999px;cursor:pointer}
button.active,button:hover{background:#eee;color:#111}
.grid{column-count:3;column-gap:18px;padding:0 5vw 80px}
.item{break-inside:avoid;margin-bottom:18px;position:relative;cursor:pointer}
.item img{width:100%;display:block;border-radius:2px;transition:.4s}
.item:hover img{transform:scale(1.02);filter:brightness(.82)}
.cap{position:absolute;left:18px;bottom:18px;opacity:0;transition:.3s;color:#fff;text-shadow:0 2px 8px #000}
.item:hover .cap{opacity:1}
.light{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);align-items:center;justify-content:center;z-index:50}
.light.open{display:flex}
.light img{max-width:92vw;max-height:90vh}
.close{position:absolute;top:24px;right:28px;font-size:38px;background:none;border:0;color:#fff}
@media(max-width:900px){.grid{column-count:2}}
@media(max-width:600px){.grid{column-count:1}.links{gap:12px}}
</style>
</head>
<body>
<nav><a class="brand" href="index.html">METANOIA</a><div class="links"><a href="index.html">Home</a><a href="gallery.html">Gallery</a><a href="index.html#about">About</a></div></nav>
<header>
<h1>Gallery</h1>
<p>The complete Metanoia archive. Night. People. Places. Details.</p>
<div class="filters">
<button class="active" data-f="all">All</button>
<button data-f="night">Night</button>
<button data-f="people">People</button>
<button data-f="places">Places</button>
<button data-f="details">Details</button>
</div>
</header>
<div id="grid" class="grid"></div>
<div class="light" id="lb"><button class="close">×</button><img id="big"></div>
<script>
const photos=[
["01-train-platform","night"],["02-drag-spotlight","people"],["03-drag-yellow","people"],["04-drag-blue","people"],["05-dj-neon","night"],["06-disco-ball","night"],["07-yellow-beam","night"],["08-night-drink","night"],["09-night-street","places"],["10-city-street","places"],["11-boat","places"],["12-statue","places"],["13-parking","places"],["14-skyline","places"],["15-bubbles","details"],["16-leaves","details"],["17-floating-leaf","details"],["18-red-drink","details"],["19-food","details"],["20-yellow-beam-2","night"]
];
const g=document.getElementById('grid');
function render(f='all'){
g.innerHTML='';
photos.forEach(p=>{
if(f!='all'&&p[1]!=f)return;
let d=document.createElement('div');
d.className='item';
d.innerHTML=`<img src="gallery/${p[0]}.webp"><div class="cap">${p[1]}</div>`;
d.onclick=()=>{lb.classList.add('open');big.src=`gallery/${p[0]}.webp`;};
g.appendChild(d);
});
}
render();
document.querySelectorAll('button[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.f);});
close.onclick=()=>lb.classList.remove('open');
lb.onclick=e=>{if(e.target==lb)lb.classList.remove('open');}
</script>
</body>
</html>
